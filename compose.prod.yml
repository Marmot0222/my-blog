name: ting-lab

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      backend: {}
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  migrate:
    build:
      context: .
      target: tools
    env_file:
      - path: .env.production
        required: false
    command: ["pnpm", "--filter", "@ting-lab/database", "exec", "tsx", "src/migrate.ts"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      backend: {}
    logging: *default-logging
    restart: "no"

  indexer:
    build:
      context: .
      target: tools
    env_file:
      - path: .env.production
        required: false
    command:
      - /bin/sh
      - -ec
      - |
        if [ "$${SKIP_CONTENT_INDEX:-0}" = "1" ]; then
          echo "SKIP_CONTENT_INDEX=1，已明确跳过内容索引。"
          exit 0
        fi
        if [ "$${CONTENT_SOURCE:-file}" = "database" ]; then
          echo "database 模式：普通部署不导入或重复入队；发布任务由 worker 消费。"
          exit 0
        fi
        pnpm --filter @ting-lab/publishing exec tsx src/cli.ts index
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      backend: {}
      # frontend 的 gw_priority 明确默认公网出口，backend 仅负责内部数据库通信。
      frontend:
        gw_priority: 1
    logging: *default-logging
    restart: "no"

  worker:
    build:
      context: .
      target: tools
    env_file:
      - path: .env.production
        required: false
    command: ["pnpm", "--filter", "@ting-lab/publishing", "exec", "tsx", "src/worker.ts"]
    environment:
      POSTGRES_PASSWORD: ""
      MEDIA_DATABASE_URL: ""
      MEDIA_DB_PASSWORD: ""
      BLOG_DB_PASSWORD: ""
      MEDIA_SERVICE_TOKEN: ""
    init: true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      backend: {}
      frontend:
        gw_priority: 1
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const fs=require('fs');if(Date.now()-Number(fs.readFileSync('/tmp/ting-lab-worker-health','utf8'))>300000)process.exit(1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 210s

  app:
    build:
      context: .
      target: web-runner
      args:
        APP_VERSION: ${APP_VERSION:-unknown}
    env_file:
      - path: .env.production
        required: false
    expose:
      - "3000"
    environment:
      POSTGRES_PASSWORD: ""
      MEDIA_DATABASE_URL: ""
      MEDIA_DB_PASSWORD: ""
      BLOG_DB_PASSWORD: ""
    init: true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      frontend:
        gw_priority: 1
      backend: {}
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s

  media-init:
    build:
      context: .
      target: tools
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BLOG_DB_USER: ${BLOG_DB_USER}
      BLOG_DB_PASSWORD: ${BLOG_DB_PASSWORD}
      MEDIA_DB_NAME: ${MEDIA_DB_NAME}
      MEDIA_DB_USER: ${MEDIA_DB_USER}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD}
    command: ["pnpm", "--filter", "@ting-lab/database", "exec", "tsx", "src/media-init.ts"]
    networks:
      backend: {}
    logging: *default-logging
    restart: "no"

  media-migrate:
    build:
      context: .
      target: tools
    environment:
      MEDIA_DATABASE_URL: ${MEDIA_DATABASE_URL}
    command: ["pnpm", "--filter", "@ting-lab/database", "exec", "tsx", "src/media-migrate.ts"]
    networks:
      backend: {}
    logging: *default-logging
    restart: "no"

  media:
    build:
      context: .
      target: media-runner
    environment:
      MEDIA_DATABASE_URL: ${MEDIA_DATABASE_URL}
      MEDIA_SERVICE_TOKEN: ${MEDIA_SERVICE_TOKEN}
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-10485760}
      MEDIA_MAX_PIXELS: ${MEDIA_MAX_PIXELS:-20000000}
      MEDIA_CONCURRENCY: ${MEDIA_CONCURRENCY:-1}
      MEDIA_TIMEOUT_MS: ${MEDIA_TIMEOUT_MS:-30000}
    init: true
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    depends_on:
      db:
        condition: service_healthy
    networks:
      backend: {}
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 35s

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      frontend: {}
    logging: *default-logging
    restart: unless-stopped
    stop_grace_period: 30s

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
